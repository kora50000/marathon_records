name: Telegram Bot Cron Test

on:
  schedule:
    # 분 시 일 월 요일 (UTC 기준)
    # 한국 시간 16:20 -> UTC 07:20
    - cron: '20 7 * * *'
  workflow_dispatch: # 버튼 눌러 즉시 실행 가능

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 체크아웃 소스코드
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요한 라이브러리 설치
      run: |
        pip install requests

    - name: 테스트 코드 실행 (시크릿 환경변수 주입)
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python test_bot.py
      
