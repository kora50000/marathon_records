name: Daily Stock Supply and Demand Bot

on:
  schedule:
    # 1. 평일 오후 2시 35분 (KST) -> 투자자 잠정치 발송
    # 14:31 KST = UTC 05:31 (14:31 - 9시간)
    - cron: '35 5 * * 1-5'
    
    # 2. 평일 오후 2시 40분 (KST) -> 나스닥 100 선물지수 브리핑 발송 (★새로 추가)
    # 14:40 KST = UTC 05:40 (14:40 - 9시간)
    - cron: '6 2 * * 1-5'
  workflow_dispatch: # 필요할 때 언제든 수동으로 가동할 수 있는 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas supabase yfinance


        # 🎯 [트랙 A] 2시 35분: 종목별 투자자 잠정치 발송
    - name: Run Investor Preview Bot
      if: github.event.schedule == '35 5 * * 1-5'
      env:
        # 🔐 중요: 금고(Secrets) 내 실제 데이터를 파이썬 시스템 환경변수(os.environ) 이름으로 매칭하여 전달합니다.
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python stock_bot/main.py  # 형님의 기존 파이썬 파일명에 맞게 매칭하세요.

      # 🎯 [트랙 B] 2시 40분: 시간별 나스닥100 선물지수 브리핑 발송 (★새로 추가)
    - name: Run Nasdaq100 Briefing Bot
      if: github.event.schedule == '40 5 * * 1-5'
      env:
        # 🔐 중요: 금고(Secrets) 내 실제 데이터를 파이썬 시스템 환경변수(os.environ) 이름으로 매칭하여 전달합니다.
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python stock_bot/nasdaq_briefing.py  # 수입된 선물지수 테이블을 긁어서 쏴주는 파이썬 스크립트 경로
