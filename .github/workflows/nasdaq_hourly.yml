name: Hourly Nasdaq Futures Collector

on:
  schedule:
    - cron: '0 22 * * 1-5' # 한국시간 월~금 오전 07:00
    - cron: '0 23 * * 1-5' # 한국시간 오전 08:00
    - cron: '0 0 * * 1-5'  # 한국시간 오전 09:00
    - cron: '0 1 * * 1-5'  # 한국시간 오전 10:00
    - cron: '0 2 * * 1-5'  # 한국시간 오전 11:00
    - cron: '0 3 * * 1-5'  # 한국시간 낮 12:00
    - cron: '0 4 * * 1-5'  # 한국시간 오후 13:00
    - cron: '0 5 * * 1-5'  # 한국시간 오후 14:00
    - cron: '30 5 * * 1-5' # 한국시간 오후 14:30 (종가 직전 최종 데이터 가집계)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install yfinance supabase requests
      - name: Run collector
        env:
          # 🔐 중요: [오른쪽 금고 내 실제 데이터]를 [왼쪽 파이썬 os.environ 이름]으로 매칭하여 노출 없이 전달합니다.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python collect_nasdaq.py
