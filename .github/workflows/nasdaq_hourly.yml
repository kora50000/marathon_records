name: Hourly Nasdaq Futures Collector

on:
  schedule:
    - cron: '0 22 * * 1-5' # 한국시간 월~금 오전 07:00
    - cron: '0 23 * * 1-5' # 한국시간 오전 08:00
    - cron: '0 0 * * 1-5'  # 한국시간 오전 09:00
    - cron: '0 1 * * 1-5'  # 한국시간 오전 10:00
    - cron: '0 2 * * 1-5'  # 한국시간 오전 11:00
    - cron: '0 3 * * 1-5'  # 한국시간 낮 12:00
    - cron: '0 4 * * 1-5'  # 한국시간 오후 13:00
    - cron: '0 5 * * 1-5'  # 한국시간 오후 14:00
    - cron: '30 5 * * 1-5' # 한국시간 오후 14:30
  workflow_dispatch: # 👈 이 줄이 들어가야 형님이 원하는 수동 실행 버튼이 화면에 생깁니다!

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install yfinance supabase
      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect_nasdaq.py
