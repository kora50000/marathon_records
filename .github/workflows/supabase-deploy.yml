name: Deploy to Supabase Edge Functions

on:
  push:
    branches:
      - main  # 기본 브랜치가 master라면 master로 수정
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃 코드
        uses: actions/checkout@v3

      - name: Supabase CLI 설치 및 배포
        uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      - name: 엣지 펑션 배포 실행
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --password "dummy_password"
          supabase functions deploy telegram-now --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}