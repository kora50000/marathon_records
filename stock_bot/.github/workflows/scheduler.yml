name: Daily Stock Supply and Demand Bot

on:
  schedule:
    # UTC 기준 오전 5시 40분 = 한국 시간(KST) 오후 2시 40분
    # 월요일부터 금요일까지 매일 실행 (토, 일 제외)
    - cron: '40 5 * * 1-5'
  workflow_dispatch: # 필요할 때 언제든 수동으로 가동할 수 있는 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: 수급 분석 스크립트 실행
      run: python main.py
